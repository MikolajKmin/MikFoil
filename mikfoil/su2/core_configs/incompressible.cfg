% ------------- GENERAL SETUP ------------%
SOLVER= INC_RANS
MATH_PROBLEM= DIRECT

% ------------------------- TURBULENCE ----------------------------%
KIND_TURB_MODEL= SST
SST_OPTIONS= KATO-LAUNDER

% ------------------------- FREE-STREAM DEFINITION ----------------------------%
FREESTREAM_DENSITY= 1.225
{% set velocity = case.mach * 340.29 %}
{% set vel_x = velocity * math.cos(math.radians(case.aoa)) %}
{% set vel_y = velocity * math.sin(math.radians(case.aoa)) %}
FREESTREAM_VELOCITY= ( {{ "%.6f"|format(vel_x) }}, {{ "%.6f"|format(vel_y) }}, 0.00 )
VISCOSITY_MODEL= CONSTANT_VISCOSITY
{% if case.reynolds > 0 %}
{% set mu = (1.225 * velocity * 1.0) / case.reynolds %}
MU_CONSTANT= {{ "%.6e"|format(mu) }}
{% else %}
MU_CONSTANT= 1.7894E-5
{% endif %}
FREESTREAM_TURBULENCEINTENSITY= 0.005
FREESTREAM_TURB2LAMVISCRATIO= 10.0

% ------------------------- REFERENCE VALUE DEFINITION ------------------------%
REF_ORIGIN_MOMENT_X = 0.25
REF_ORIGIN_MOMENT_Y = 0.00
REF_ORIGIN_MOMENT_Z = 0.00
REF_LENGTH= 1.0
REF_AREA= 1.0

% ----------------------- BOUNDARY CONDITION DEFINITION -----------------------%
MARKER_HEATFLUX= ( airfoil, 0.0 )
MARKER_FAR= ( farfield )
MARKER_PLOTTING= ( airfoil )
MARKER_MONITORING= ( airfoil )

% ------------------------ NUMERICAL METHOD DEFINITION ------------------------%
CONV_NUM_METHOD_FLOW= FDS
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
MUSCL_FLOW= YES

% --------------------------- LINEAR SOLVER DEFINITION ------------------------%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU

% --------------------------- TIME-MARCHING PARAMETERS ------------------------%
TIME_DOMAIN= NO
TIME_DISCRE_FLOW= EULER_IMPLICIT
TIME_DISCRE_TURB= EULER_IMPLICIT
CFL_NUMBER= 1.0
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.5, 1.15, 1.0, 1000.0 )

% --------------------------- CONVERGENCE PARAMETERS --------------------------%
ITER= 2000
CONV_FIELD= (LIFT, DRAG)
CONV_STARTITER= 200
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-5
CONV_RESIDUAL_MINVAL= -8

% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
MESH_FILENAME= mesh.su2
MESH_FORMAT= SU2
OUTPUT_FILES= (RESTART, PARAVIEW, SURFACE_PARAVIEW)
RESTART_SOL= {% if case.restart %}YES{% else %}NO{% endif %}
SOLUTION_FILENAME= restart.dat
RESTART_FILENAME= restart.dat
VOLUME_OUTPUT= (COORDINATES, SOLUTION, PRIMITIVE)
CONV_FILENAME= history
SURFACE_FILENAME= surface
VOLUME_FILENAME= volume  
HISTORY_OUTPUT= (ITER, LIFT, DRAG, MOMENT_Z, RES_RMS_DENS) 
