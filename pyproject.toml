[project]
name = "mikfoil"
version = "0.1.0"
description = "Computational physics meshing library for airfoils"
readme = "README.md"
requires-python = ">=3.12"

authors = [
  { name="Mikolaj Kmin" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "pyyaml>=6.0.3",
    "scipy>=1.18.0",
    "xarray>=2026.7.0",
    "jinja2>=3.1.0",
    "matplotlib>=3.8.0",
    "pyvista>=0.43.0",
]

[project.urls]
"Homepage" = "https://github.com/MikolajKmin/MikFoil"
"Bug Tracker" = "https://github.com/MikolajKmin/MikFoil/issues"

[project.optional-dependencies]
tutorials = [
    "jupyter>=1.1.1",
    "ipykernel>=7.3.0",
    "nbformat>=5.10.4",
    "pyvista[jupyter]>=0.48.4",
    "ipywidgets>=8.1.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mikfoil", "mikfoil.*"]

[tool.setuptools.package-data]
"mikfoil.su2.core_configs" = ["*.cfg"]
